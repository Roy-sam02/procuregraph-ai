# Local synthetic graph; start after PostgreSQL stops on the 4 GB laptop.
services:
  neo4j:
    image: neo4j:5.26.32-community
    mem_limit: 1024m
    environment:
      NEO4J_AUTH: "neo4j/${PROCUREGRAPH_NEO4J_PASSWORD:?Set PROCUREGRAPH_NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_http_enabled: "false"
    ports:
      - "127.0.0.1::7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
