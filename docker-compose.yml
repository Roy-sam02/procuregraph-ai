services:
  postgres:
    image: postgres:17
    mem_limit: 256m
    environment:
      POSTGRES_DB: procuregraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PROCUREGRAPH_DB_PASSWORD:?Set PROCUREGRAPH_DB_PASSWORD}"
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
